<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- UNO Colors Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="35%" stop-color="#f59e0b"/>
      <stop offset="70%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Tile Base -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="#334155" stroke-width="2"/>

  <!-- Tilted UNO Card Badge -->
  <g transform="translate(32, 32) rotate(-8) translate(-32, -32)" filter="url(#glow)">
    <!-- Card Body -->
    <rect x="14" y="10" width="36" height="44" rx="7" fill="#1e293b" stroke="#f8fafc" stroke-width="2.5"/>
    
    <!-- UNO Oval with Gradient -->
    <ellipse cx="32" cy="32" rx="14" ry="17" fill="url(#cardGrad)" transform="rotate(25 32 32)"/>
    <ellipse cx="32" cy="32" rx="11" ry="14" fill="#0f172a" transform="rotate(25 32 32)"/>
  </g>

  <!-- White Chess Knight (High contrast in center) -->
  <g transform="translate(18, 17) scale(0.62)" fill="#ffffff" stroke="#000000" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <path d="M 22 10 C 32.5 11 38.5 18 38 39 L 15 39 C 15 30 25 32.5 23 18" stroke-linecap="butt"/>
    <path d="M 24 18 C 24.38 20.91 18.45 22.6 16 27 C 13 29.5 16 34.5 21 31 C 26 27.5 23 39 38 39"/>
    <path d="M 9.5 25.5 A 0.5 0.5 0 1 1 8.5 25.5 A 0.5 0.5 0 1 1 9.5 25.5 z" fill="#000"/>
    <path d="M 15 15.5 A 0.5 1.5 0 1 1 14 15.5 A 0.5 1.5 0 1 1 15 15.5 z" transform="matrix(0.866,0.5,-0.5,0.866,9.693,-5.173)" fill="#000"/>
  </g>

  <!-- Corner UNO Dots -->
  <circle cx="8" cy="8" r="2.5" fill="#ef4444"/>
  <circle cx="56" cy="8" r="2.5" fill="#3b82f6"/>
  <circle cx="8" cy="56" r="2.5" fill="#10b981"/>
  <circle cx="56" cy="56" r="2.5" fill="#f59e0b"/>
</svg>
